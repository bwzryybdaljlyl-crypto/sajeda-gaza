<style>
  :root {
    --green: #009736;
    --red: #ee2a35;
    --white: #ffffff;
    --black: #1b1b1b;
    --ink: #04100a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Tajawal", "Noto Kufi Arabic", "Segoe UI", "Dubai", "Geeza Pro", "Arial", sans-serif;
    background: var(--ink);
    color: #f4fbf6;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 34px 18px 48px;
    position: relative;
    overflow-x: hidden;
  }
  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 70vw; height: 70vw; top: -22vw; right: -20vw;
    background: radial-gradient(circle, rgba(0,151,54,.55), transparent 70%);
  }
  body::after {
    width: 70vw; height: 70vw; bottom: -26vw; left: -22vw;
    background: radial-gradient(circle, rgba(238,42,53,.42), transparent 70%);
  }
  .wrap { position: relative; z-index: 1; width: 100%; max-width: 440px; text-align: center; }

  .avatar {
    width: 148px; height: 148px; margin: 6px auto 20px;
    border-radius: 50%;
    padding: 4px;
    background: conic-gradient(from 200deg, var(--black), var(--green), #ffffff, var(--red), var(--black));
    box-shadow: 0 0 34px rgba(0,151,54,.65), 0 0 70px rgba(0,151,54,.32);
  }
  .avatar img {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
    display: block; border: 3px solid rgba(4,16,10,.9);
  }

  h1 {
    font-size: 42px; line-height: 1.25; margin: 0 0 8px; font-weight: 800; letter-spacing: .005em;
    background: linear-gradient(100deg, var(--black) 0%, var(--green) 18%, #ffffff 50%, var(--red) 82%, var(--black) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 10px rgba(0,0,0,.85));
  }
  .handle {
    margin: 0 0 18px; font-size: 15px; letter-spacing: .06em;
    color: rgba(244,251,246,.66); direction: ltr;
  }

  .bio {
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 20px;
    padding: 18px 18px 20px;
    font-size: 15.5px; line-height: 2.05; font-weight: 400; letter-spacing: .01em;
    margin-bottom: 26px;
    backdrop-filter: blur(6px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
  }

  .btns { display: grid; gap: 13px; }
  .btn {
    display: flex; align-items: center; gap: 13px;
    padding: 15px 18px;
    border-radius: 16px;
    text-decoration: none;
    color: #f4fbf6;
    font-size: 16.5px; font-weight: 700;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.16);
    transition: transform .12s ease, box-shadow .2s ease, background .2s ease;
  }
  .btn:hover { background: rgba(255,255,255,.12); box-shadow: 0 8px 26px rgba(0,151,54,.28); }
  .btn:active { transform: scale(.965); background: rgba(255,255,255,.17); }
  .btn.primary {
    background: linear-gradient(120deg, var(--red), #b81d27);
    border-color: rgba(255,255,255,.28);
    box-shadow: 0 10px 30px rgba(238,42,53,.35);
  }
  .btn.primary:active { transform: scale(.965); }
  .ic { width: 26px; height: 26px; flex: 0 0 26px; display: grid; place-items: center; }
  .ic svg { width: 24px; height: 24px; display: block; }
  .lbl { flex: 1; text-align: right; }

  

  .ribbon {
    margin-top: 30px; display: flex; justify-content: center; gap: 7px;
  }
  .ribbon i { display: block; width: 38px; height: 5px; border-radius: 4px; opacity: .95; }
  .ribbon i:nth-child(1) { background: var(--black); box-shadow: 0 0 0 1px rgba(255,255,255,.18); }
  .ribbon i:nth-child(2) { background: #ffffff; }
  .ribbon i:nth-child(3) { background: var(--green); }
  .ribbon i:nth-child(4) { background: var(--red); }
  .foot { margin-top: 16px; }
  .foot .tag { margin: 0 0 8px; font-size: 14.5px; font-weight: 700; color: rgba(244,251,246,.72); letter-spacing: .01em; }
  .foot .copy { margin: 0; font-size: 13.5px; font-weight: 500; color: rgba(244,251,246,.45); letter-spacing: .02em; }
  
  @media (max-width: 360px) { h1 { font-size: 34px; } }
</style>
